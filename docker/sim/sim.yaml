# WHAT the sim runs: the one file that locates the scenario, the drone, the world and the PX4 params.
# SIM_SCENARIO (config/bisg.conf) points here; `./bisg up -c <name>` still runs any other scenario for one run.
# Paths are relative to this file (or absolute /workspace/...). Expanded by docker/sim/launcher/launch.py expand_locator;
# keys set here win over the scenario and vehicle files (one key, one place: these are NOT set there).
#
# The Iris instead:   scenario: configs/single_iris.yaml, vehicle: null, model: null, px4_params: [iris]

scenario: configs/raptor_scenario.yaml         # app, render, physics, PX4 airframe
vehicle: assets/vehicles/raptor/raptor.yaml    # the `vehicles:` entry: spawn pose, ZED/ToF mounts, chase cam
model: assets/vehicles/raptor/raptor.usd       # drone USD for every vehicle without its own usd_path (null = the vehicle's `model:`)
world: Simple Room                             # Pegasus preset name (pegasus.simulator.params.SIMULATION_ENVIRONMENTS) or a .usd path
px4_params: [raptor]                           # docker/sim/px4/<name>.params: the vehicle file (iris | raptor), then overlays
                                               # (ekf2_vision, ekf2_flow_range), later wins

# Simple Room (Isaac 6.0 asset, measured 2026-10-11): floor top z = -0.77, ceiling 3.41, inner walls x -4.41..4.41,
# y -3.31..4.77 (window wall), `table_low` at the origin: x -1.59..1.59, y -0.81..0.81, top z = 0.01. The default
# spawn (0, 0, 0.11) would be ON the table, so the drone starts on the floor west of it, facing the table (+x).
spawn:                                         # first vehicle's start pose (overrides its `position` / `yaw_deg`)
  position: [-2.5, 0.0, -0.66]                 # world ENU m: floor -0.77 + 0.11 rest height (raptor.yaml). PX4's map origin = here
  yaw_deg: 0.0                                 # facing +x, the table

# Scan target for Kinetix (kinetix/config/scenes/simple_room_blocks.yaml): two blocks on the table, world ENU, static.
objects:
  - {name: kx_block, type: cuboid, position: [0.0, 0.0, 0.16], size: [0.40, 0.30, 0.30], color: [0.85, 0.35, 0.10]}
  - {name: kx_tower, type: cuboid, position: [0.08, 0.04, 0.435], size: [0.15, 0.15, 0.25], color: [0.15, 0.45, 0.85]}
