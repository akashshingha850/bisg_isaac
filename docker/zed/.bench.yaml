# derived by `python3 -m zed_stack derive` - do not edit
camera:
  grab_resolution: HD720
  grab_frame_rate: 30
  pub_frame_rate: 30.0
  camera_timeout_sec: 5
  camera_max_reconnect: 5
  camera_flip: false
  self_calib: true
video:
  publish_left_right: true
  publish_rgb: true
  publish_raw: true
  publish_gray: true
  publish_stereo: true
  auto_exposure_gain: true
  exposure: 80
  gain: 80
  auto_whitebalance: true
sensors:
  publish_imu: true
  publish_imu_raw: true
  publish_imu_tf: true
  publish_cam_imu_transf: true
  sensors_pub_rate: 200.0
depth:
  enabled: true
  depth_mode: NEURAL_LIGHT
  min_depth: 0.2
  max_depth: 15.0
  depth_confidence: 95
  depth_texture_conf: 100
  remove_saturated_areas: true
  publish_depth_map: true
  publish_depth_confidence: true
  publish_disparity: true
  publish_depth_info: true
  publish_point_cloud: true
  point_cloud_freq: 10.0
  point_cloud_res: COMPACT
  voxel_point_cloud: false
region_of_interest:
  enabled: true
  depth_far_threshold_meters: 2.5
  image_height_ratio_cutoff: 0.5
  publish_roi_mask: true
positional_tracking:
  enabled: true
  pos_tracking_mode: AUTO
  imu_fusion: true
  publish_tf: true
  publish_map_tf: false
  area_memory: false
  area_file_path: ''
  set_gravity_as_origin: true
  two_d_mode: false
  publish_odom_pose: true
  publish_pose_cov: true
  publish_cam_path: true
  publish_3d_landmarks: true
global_localization:
  enabled: false
  gnss_fix_topic: /fix
  gnss_zero_altitude: false
  enable_reinitialization: false
spatial_mapping:
  enabled: false
  resolution: 0.05
  max_mapping_range: 5.0
  fused_pointcloud_freq: 1.0
plane_detection:
  enabled: true
  pd_max_distance_threshold: 0.15
  pd_normal_similarity_threshold: 15.0
object_detection:
  enabled: false
  detection_model: MULTI_CLASS_BOX_FAST
  enable_tracking: true
  max_range: 15.0
  filtering_mode: NMS3D
  prediction_timeout: 2.0
  allow_reduced_precision_inference: false
  classes:
    people:
      enabled: true
      confidence_threshold: 65.0
    vehicle:
      enabled: true
      confidence_threshold: 60.0
    bag:
      enabled: false
      confidence_threshold: 40.0
    animal:
      enabled: false
      confidence_threshold: 40.0
    electronics:
      enabled: false
      confidence_threshold: 45.0
    fruit_vegetable:
      enabled: false
      confidence_threshold: 50.0
    sport:
      enabled: false
      confidence_threshold: 30.0
body_tracking:
  enabled: false
  model: HUMAN_BODY_FAST
  body_format: BODY_38
  max_range: 15.0
  enable_body_fitting: false
  enable_tracking: true
streaming:
  enabled: false
  codec: H265
  port: 30000
  bitrate: 12500
  adaptative_bitrate: false
recording:
  svo_encoding_preset: DEFAULT
services:
  px4_bridge:
    enabled: true
    health:
      enabled: true
      depth_min_valid: 0.3
      timeout_s: 2.0
    odometry:
      enabled: true
      restamp: false
      min_rate_hz: 5.0
    obstacle_distance:
      enabled: true
      band: 0.6
      min_range: 0.3
      max_range: 8.0
      rate_hz: 10.0
  qgc_video:
    enabled: false
    topic: ''
    host: 127.0.0.1
    port: 5600
    bitrate: 2000
    fps: 0
    encoder: auto
sim:
  positional_tracking:
    imu_fusion: false
  sensors:
    sensors_image_sync: true
  services:
    px4_bridge:
      odometry:
        enabled: false
        restamp: true
        min_rate_hz: 2.0
