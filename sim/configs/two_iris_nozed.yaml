# Scenario: two Iris quadrotors, no ZED. Sim-level multi-drone check for the Isaac Sim 6.0 migration
# (docs/migrate.md §39-40): unique PX4 instance / MAV_SYS_ID / MAVLink ports / ROS namespace per vehicle.
# NOT Phase 6 swarm work: no fleet manager, no per-drone compose services, just the launcher's vehicles list.
extends: single_iris_nozed.yaml

vehicles:
  - id: 0
    model: Iris
    position: [0.0, 0.0, 0.07]
    yaw_deg: 0.0
    ros2: {enabled: true, pub_state: true, pub_sensors: false, pub_graphical_sensors: false}
    sensors: {zed: {enabled: false}}
  - id: 1
    model: Iris
    position: [3.0, 0.0, 0.07]
    yaw_deg: 0.0
    ros2: {enabled: true, pub_state: true, pub_sensors: false, pub_graphical_sensors: false}
    sensors: {zed: {enabled: false}}
