# ZED Mini feature switches — ONE place for "which ZED SDK features does the drone run".
#
#   * Real drone: overlay for zed_wrapper (ZED SDK 5.4.1, ZED_SDK pin), applied via
#     ros_params_override_path in deploy/jetson/compose.yaml. Names are the wrapper's own parameters
#     (third_party/zed-ros2-wrapper/zed_wrapper/config/common_stereo.yaml has every option + docs).
#   * Sim: sim/launcher reads this same file (scenario `sensors.zed.features_file`) and emulates the
#     features it can; a scenario may override single switches under `sensors.zed.features`.
#     Anything switched on that the sim can't emulate is logged at startup as "not simulated".
#
# Tags:  [sim]      emulated in Isaac (docs/zed-features.md says how)
#        [hw]       real ZED SDK only (AI models, SVO, streaming...) — the switch is ignored in sim
#        [not zedm] hardware the ZED Mini doesn't have — leave false
# `publish_*` switches only *advertise* a topic; the wrapper (and the sim) publishes it only while
# something subscribes, so leaving one on costs nothing until it is used.
# Frame ids / rates follow docs/interface-contract.md.
/**:
  ros__parameters:
    general:
      camera_model: zedm
      camera_name: zed
      grab_resolution: HD720          # HD2K | HD1080 | HD720 | VGA  (sim: sensors.zed.resolution)
      grab_frame_rate: 30             # ZED Mini @HD720: 15/30/60
      pub_frame_rate: 30.0

    video:                            # image topics
      publish_left_right: true        # [sim] left/ + right/ rectified colour images (+ camera_info)
      publish_rgb: false              # [hw]  rgb/ = left image again, under the wrapper's "rgb" name
      publish_raw: false              # [hw]  unrectified images (sim images are already ideal)
      publish_gray: false             # [hw]  grayscale images
      publish_stereo: false           # [hw]  side-by-side left|right image

    sensors:                          # ZED Mini IMU: accelerometer + gyroscope only
      publish_imu: true               # [sim] imu/data (sim: one sample per physics step)
      publish_imu_raw: false          # [hw]  imu/data_raw
      publish_imu_tf: true
      publish_cam_imu_transf: false   # [hw]  left_cam_imu_transform
      publish_mag: false              # [not zedm] no magnetometer on the ZED Mini
      publish_baro: false             # [not zedm] no barometer
      publish_temp: false             # [not zedm]
      sensors_image_sync: false
      sensors_pub_rate: 200.0

    depth:
      depth_mode: NEURAL_LIGHT        # [hw]  NONE | NEURAL_LIGHT | NEURAL | NEURAL_PLUS — NEURAL/NEURAL_PLUS cost
                                      #       more on Orin NX; measure in Phase 5. Sim depth is exact geometry.
      min_depth: 0.2                  # m (sim: sensors.zed.depth_range)
      max_depth: 15.0
      publish_depth_map: true         # [sim] depth/depth_registered (32FC1 m)
      publish_point_cloud: true       # [sim] point_cloud/cloud_registered (x y z rgb)
      point_cloud_freq: 10.0          # [sim] Hz
      point_cloud_res: COMPACT        # [sim] COMPACT | REDUCED (sim: every 4th / 8th pixel)
      publish_disparity: false        # [sim] disparity/disparity_image (stereo_msgs/DisparityImage, f*B/Z)
      publish_depth_confidence: false # [hw]  confidence/confidence_map (sim depth has no uncertainty)
      publish_depth_info: false       # [hw]  depth/depth_info (zed_msgs — not in the sim image)
      voxel_point_cloud: false        # [hw]  voxel-decimated cloud (SDK >= 5.3)

    region_of_interest:
      automatic_roi: false            # [hw]  auto-mask drone parts seen by the camera (props/legs). The sim
                                      #       view is clear (docs/bugs.md fixed 2026-09-25); try on the real frame
      publish_roi_mask: false         # [hw]

    pos_tracking:                     # visual-inertial odometry -> PX4 EV (vio_relay). Sim: the real SDK tracks the streamed
                                      # ZED Mini (ZED_SOURCE=sdk) or vio_mock stands in (emulated), docs/zed-sdk-sim.md
      pos_tracking_enabled: true      # [sim] zed/zed_node/odom
      pos_tracking_mode: AUTO         # [sim+hw] AUTO | GEN_1 | GEN_3 (wrapper 5.4.1 has no GEN_2: it is not a valid value). AUTO = the SDK's
                                      #       own default, GEN_3 on SDK 5.4 — the best visual-inertial mode for a drone. Sim runs the same
                                      #       mode through the real SDK (deploy/sim/zed_sim_overlay.yaml turns IMU fusion off there)
      imu_fusion: true                # [hw]
      publish_tf: true
      publish_map_tf: false           # PX4/MAVROS owns map; wrapper publishes odom -> base only
      base_frame: base_link
      map_frame: map
      odometry_frame: odom
      area_memory: false              # [hw]  loop closure / relocalisation in a saved area
      area_file_path: ''              # [hw]  .area file to relocalise in a known site (Phase 5+)
      floor_alignment: false          # [hw]
      two_d_mode: false               # [hw]  force planar motion (ground robots — keep false on a drone)
      publish_odom_pose: true         # [sim] odom (+ pose on hw)
      publish_pose_cov: false         # [hw]
      publish_cam_path: false         # [hw]  path_odom / path_map trajectories
      publish_3d_landmarks: false     # [hw]  VIO landmarks (debug)

    gnss_fusion:
      gnss_fusion_enabled: false      # [hw]  fuse a NavSatFix into the VIO pose (outdoor only; we fly GPS-denied)

    mapping:                          # spatial mapping: fused colour point cloud of everything seen
      mapping_enabled: false          # [sim] mapping/fused_cloud (+ GUI overlay in sim)
      resolution: 0.05                # [sim] voxel size m [0.01, 0.2]
      max_mapping_range: 5.0          # [sim] m, points further away are not fused
      fused_pointcloud_freq: 1.0      # [sim] Hz
      publish_det_plane: false        # [hw]  plane detection on an RViz clicked point

    object_detection:                 # AI 3D boxes (people, vehicles, animals, ...): obj_det/objects
      od_enabled: false               # [hw]  needs zed_msgs + the model download; heavy on Orin NX
      detection_model: MULTI_CLASS_BOX_FAST
      max_range: 15.0

    body_tracking:                    # AI human skeletons: body_trk/skeletons
      bt_enabled: false               # [hw]
      model: HUMAN_BODY_FAST
      body_format: BODY_38

    stream_server:
      stream_enabled: false           # [hw]  stream the camera over the network (ZED SDK client can open it)
      codec: H265
      port: 30000
