# Sim-only overrides for zed_wrapper when it reads the streamed ZED Mini twin (ZED_SOURCE=sdk, docs/zed-sdk-sim.md).
# Layered AFTER deploy/jetson/zed_params.yaml, so the wrapper in sim runs the hardware params plus ONLY these lines.
# Everything here exists because the simulated stream is not a full camera; each line says what to check on hardware.
/**:
  ros__parameters:
    pos_tracking:
      # The extension streams orientation + acceleration once per rendered frame (frame rate), never the 400 Hz
      # gyro+accel stream of the real ZED Mini. GEN_3 refuses to fuse a low-rate IMU ("HIGH FREQUENCY SENSORS DATA
      # REQUIRED" -> wrapper FATAL). Visual-only GEN_3 works. On hardware imu_fusion stays true (zed_params.yaml).
      imu_fusion: false
    sensors:
      # Without this the wrapper polls the (absent) sensor channel on every grab and logs
      # "sl::getSensorsData error: INVALID FUNCTION PARAMETERS" thousands of times a minute.
      sensors_image_sync: true
