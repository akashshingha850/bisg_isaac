# bisg_isaac settings. Plain KEY=VALUE, no spaces around `=`, `#` starts a comment
# (so a value must not contain one). `./bisg config` prints every key, its value and
# where that value came from; `./bisg config --edit` opens this file.
#
# Precedence, first one that sets a key wins:
#   1. command-line flag   ./bisg up headless -c headless_fast --web
#   2. shell environment   SIM_VIEW=headless ./bisg up
#   3. docker/.env         this machine only, git-ignored
#   4. this file
#   5. built-in fallbacks in scripts/_common.sh (kept in sync with this file)
#
# What the world CONTAINS is not here — that is the scenario YAML, docker/sim/configs/*.yaml.
# Full reference: docs/configuration.md.


# --- What you see -------------------------------------------------------------
# One knob for the window and the remote view. docs/remote-access.md.
#
#   gui       Isaac window on $DISPLAY (needs a reachable X server)
#   headless  no picture at all — fastest, use it for tests, CI and timing runs
#   web       headless + still frames on SIM_WEB_PORT (TCP only)
#             survives a VS Code / SSH port forward, so this is the one for tunnels
#   webrtc    headless + interactive WebRTC stream, needs TCP 49100 + UDP 47998,
#             so LAN or Tailscale only — a tunnel will not carry it
#   both      headless + web + webrtc
#   auto      gui when an X server is reachable, else headless
#
# Combine the window and a stream with `+`, e.g. SIM_VIEW=gui+webrtc.
# `web` and `webrtc` force rendering on (rtf 0.74 -> 0.47 on the warehouse scene):
# never leave one on for a timing or regression run.
# Per run: `./bisg up gui|headless|web|webrtc|both` or `--web` / `--stream` / `--no-stream`.
SIM_VIEW=auto

# Address a remote viewer connects to: this machine's LAN, Tailscale or public IP.
# `tailscale` = this host's tailnet IP from the `tailscale` service (./bisg tailscale up): the way in from another network.
# Machine-specific: set it in docker/.env. Empty = local clients only. WebRTC media never arrives without it when the client
# is on another machine — it is what the server advertises.
SIM_VIEW_ADDR=192.168.192.200

# --- Remote access (another network) -------------------------------------------
# The `tailscale` service: a Tailscale node on the host network (docs/remote-access.md, ADR-009).
# `./bisg tailscale up` joins this host to your tailnet; the remote machine joins the same tailnet
# (Tailscale app, or `./bisg tailscale up` there too). Login is in a browser: `./bisg tailscale login`
# prints the URL (or --qr); it is kept in the tailscale-state volume. No auth keys (ADR-009).
# Name of this host on the tailnet. Empty = bisg-<hostname>.
TAILSCALE_HOSTNAME=
# Extra `tailscale up` flags for ./bisg tailscale login, e.g. --ssh (Tailscale SSH) or --advertise-tags=tag:sim.
TAILSCALE_EXTRA_ARGS=

# TCP port for the `web` view. Forward this one port and the view works anywhere.
SIM_WEB_PORT=8899

# Seconds between frames in `web` mode. Lower = smoother, and more GPU spent on capture.
SIM_WEB_INTERVAL=1.0


# --- Sim ----------------------------------------------------------------------
# Scenario: a file name in docker/sim/configs/ (without .yaml) or an absolute path.
#   single_iris      warehouse + one Iris quadrotor, GPS
#   single_iris_vio  same, GPS-denied: EKF2 on vio_mock (needs `./bisg all`); tests/vio_flight.py
#   headless_fast  stripped-down profile for tests (no materials, no rendering)
# `./bisg up -c <name>` overrides this for one run.
SIM_SCENARIO=single_iris

# Where the ZED Mini topics (images, depth, point cloud, odometry, TF) come from in the sim. docs/zed-sdk-sim.md
#   emulated  Isaac cameras publish the contract topics directly (sim/launcher/zed_rig.py); odometry = vio_mock. No ZED SDK.
#   sdk       the sim streams a ZED Mini twin into the REAL ZED SDK; the unmodified zed_wrapper (`./bisg zed up`) publishes
#             everything, exactly as on the Jetson. Needs `./bisg zed ext-build` once. A scenario's sensors.zed.source wins.
ZED_SOURCE=emulated
# What the ZED does (SDK modules, PX4 bridge, QGC video) is docker/zed/zed.yaml, not here: ./bisg zed plan.

# Seconds `./bisg up` / `./bisg wait` wait for "[launch] sim ready" + PX4 "Ready for takeoff".
# Cold boot on this workstation is ~4-5 min (asset download + shader cache).
SIM_WAIT_TIMEOUT=600


# --- ROS 2 / DDS ----------------------------------------------------------------
# Containers are ROS 2 Jazzy with CycloneDDS (ADR-004/005). Same domain in every
# container; change it if another ROS 2 system shares the network.
ROS_DOMAIN_ID=0


# --- Drone identity and MAVLink -------------------------------------------------
# Port math is fixed by docs/interface-contract.md: drone N -> namespace /drone_N,
# MAV_SYS_ID N, PX4 SITL instance N-1, udp://:14540+i@127.0.0.1:14580+i,
# Pegasus <-> PX4 on tcp 4560+i.
DRONE_ID=1

# MAVROS <-> PX4 link. Empty = derived from DRONE_ID (the line above).
# On real hardware this becomes a serial URL, e.g. /dev/ttyPixracer:921600.
FCU_URL=

# Second MAVROS link for a GCS or logger, e.g. udp://@192.168.1.50:14550. Empty = off.
GCS_URL=

# Port PX4's GCS stream lands on; `./bisg debug mavlink` listens here. QGroundControl too.
MAVLINK_GCS_PORT=14550


# --- PX4 bridge: what talks to the flight controller ---------------------------------
# ONE service (px4-bridge, docker/compose.yaml), one container per drone and bridge; this key says which bridge(s) to run: one value or a list (mavros,xrce). docs/px4-bridge.md, numbers in archive/px4-link-study/.
#   mavros   MAVLink -> standard ROS 2 topics /drone_N/mavros/*. The default, and the only one the ZED bridge, vio_mock and tests use.
#   mavsdk   gRPC server for any MAVSDK client, no ROS topics.
#   xrce     uXRCE-DDS agent: PX4's uORB as ROS 2 topics /fmu/*. No landing/follow target, params or camera protocol.
#   none     no bridge
# `./bisg px4-bridge plan` shows it, `./bisg px4-bridge up` starts it, `./bisg px4-bridge up xrce` runs another one for a single run.
PX4_BRIDGE=mavros

# MAVROS plugin set: lean = the 17 plugins this project uses (docker/ros/mavros_lean.yaml, idle 9 % CPU / 144 MB); full = stock (~50, 28 % / 255 MB).
MAVROS_PLUGINS=lean
# gRPC port of the mavsdk bridge: System(mavsdk_server_address="localhost", port=50051) with the `mavsdk_grpc` package.
MAVSDK_PORT=50051
# xrce agent: UDP port in the sim (PX4 SITL's client dials 8888), serial baud on the drone (PX4 SER_TEL2_BAUD must match).
XRCE_PORT=8888
XRCE_BAUD=921600


# --- Version pins ---------------------------------------------------------------
# ADR decisions: change a tag here AND docs/plan.md §4 AND the ADR, then
# `./bisg setup --rebuild`. ADR-002 (Isaac/Docker), ADR-003 (PX4), ADR-005 (Jazzy).
# Isaac Sim 6.0.0 + Pegasus PR #144 (not a release tag; Isaac 6 support) — see archive/docs/migration-report.md.
# PX4 stays v1.17.0 (must equal the Pixracer firmware, ADR-003); v1.16.0 was also validated on 6.0 and is the fallback.
ISAAC_TAG=6.0.0
PX4_TAG=v1.17.0
PEGASUS_TAG=pr144-fcb99c0
ZED_SDK=5.4.1
# Stereolabs `zed-isaac-sim` extension: streams the simulated ZED Mini into the real ZED SDK (docs/zed-sdk-sim.md).
# v5.2.x is the line for Isaac Sim 6.0 and the only one with the ZED Mini (`ZED_M`); the 5.1 line (Kit 107.3) has ZED X only.
ZED_ISAAC_EXT_TAG=v5.2.1
# Tailscale image of the `tailscale` service (ADR-009).
TAILSCALE_TAG=v1.102.5

# Base images the builds start from.
ISAAC_IMAGE=nvcr.io/nvidia/isaac-sim
ROS_BASE_IMAGE=ros:jazzy-ros-base


# --- Upstream sources and local paths -------------------------------------------
# Used by scripts/fetch_sources.sh and pull_images.sh. Tags are in the pins block.
PEGASUS_REPO=https://github.com/PegasusSimulator/PegasusSimulator.git
ZED_WRAPPER_REPO=https://github.com/stereolabs/zed-ros2-wrapper.git
ZED_ISAAC_EXT_REPO=https://github.com/stereolabs/zed-isaac-sim.git
PX4_REPO=https://github.com/PX4/PX4-Autopilot.git

# `scripts/pull_images.sh --save` writes the Isaac image tarball here (risk R7).
# Default assumes a large secondary mount named /media/ubuntu/ssd; override per
# machine in docker/.env (e.g. ARCHIVE_DIR=/opt/docker-archive) if that mount
# doesn't exist on this workstation.
ARCHIVE_DIR=/media/ubuntu/ssd/docker-archive
